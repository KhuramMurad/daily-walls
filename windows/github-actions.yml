name: Windows preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-certifi
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-webp-pixbuf-loader
            mingw-w64-ucrt-x86_64-pyinstaller
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s windows/tests -v
      - name: Build portable application
        run: python windows/build.py
      - name: Validate packaged application outside MSYS2
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:GI_TYPELIB_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:GDK_PIXBUF_MODULE_FILE -ErrorAction SilentlyContinue
          & ./dist/windows/DailyWalls/DailyWallsCLI.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged self-test failed' }
          & ./dist/windows/DailyWalls/DailyWallsCLI.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI startup failed' }
          $gui = Start-Process ./dist/windows/DailyWalls/DailyWalls.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($gui.ExitCode -ne 0) { throw 'Windowed launcher self-test failed' }
      - name: Upload Windows preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-walls-windows-x64-preview
          path: |
            dist/windows/daily-walls-*-windows-x64.zip
            dist/windows/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish validated Windows preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh run download $env:RUN_ID --name daily-walls-windows-x64-preview --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download validated package' }
          $archives = @(Get-ChildItem release -Filter 'daily-walls-*-windows-x64.zip' -Recurse)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows archive' }
          $archive = $archives[0]
          $version = $archive.Name -replace '^daily-walls-', '' -replace '-windows-x64.zip$', ''
          $checksums = Join-Path $archive.DirectoryName 'SHA256SUMS'
          $expected = ((Get-Content $checksums -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $expected) {
            throw 'Windows archive checksum mismatch'
          }
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$version already exists; keeping its published assets."
            exit 0
          }
          gh release create "v$version" $archive.FullName $checksums --target $env:COMMIT_SHA --title "Daily Walls $version - Windows preview" --prerelease --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Windows release publication failed' }
